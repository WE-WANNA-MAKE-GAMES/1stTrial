name: Commit Notification

on:
    push:

jobs:
    notify-discord:
        runs-on: ubuntu-latest

        steps:
            - name: Notify Discord
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMIT_WEBHOOK_URL }}
                  BRANCH: ${{ github.ref_name }}
                  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                  COMMIT_URL: ${{ github.event.head_commit.url }}
                  AUTHOR: ${{ github.event.head_commit.author.name }}
              run: |
                  jq -n \
                    --arg branch "$BRANCH" \
                    --arg message "$COMMIT_MESSAGE" \
                    --arg author "$AUTHOR" \
                    --arg url "$COMMIT_URL" \
                    '{
                      embeds: [{
                        title: "Commit",
                        description: $message,
                        fields: [
                          {
                            name: "Author",
                            value: $author,
                            inline: true
                          },
                          {
                            name: "Branch",
                            value: $branch,
                            inline: true
                          }
                        ],
                        url: $url
                      }]
                    }' |
                  curl \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d @- \
                    "$DISCORD_WEBHOOK_URL"
